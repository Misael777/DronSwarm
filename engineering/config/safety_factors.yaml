# Factores de seguridad del proyecto (fuente: docs/flujo/Flujo_Trabajo_Enjambre_Drones_Mineria.pdf, sección 9).
# "design" = valor que usa el dimensionamiento; [min, max] = rango típico del documento.
# Cambiar un valor aquí exige registrar el motivo en docs/decisiones.md.

thrust_to_weight:      # empuje máximo total / peso, en el caso de diseño (5,000 msnm, 15 °C)
  min: 1.8
  max: 2.5
  design: 2.0
motor_current:         # corriente máxima del motor / corriente en empuje máximo
  min: 1.3
  max: 1.5
  design: 1.3
esc_current:           # corriente nominal del ESC / corriente máxima del motor
  min: 1.3
  max: 1.5
  design: 1.3
battery_capacity:      # capacidad instalada / energía que pide la misión (frío, envejecimiento)
  min: 1.3
  max: 1.5
  design: 1.3
structure:             # carga de falla / carga máxima de servicio (brazos)
  min: 2.0
  max: 3.0
  design: 2.5
flight_time_margin:    # autonomía de diseño / autonomía objetivo (20-30 % por encima)
  min: 1.2
  max: 1.3
  design: 1.2
