# DronSwarm · mavlink-router en la Raspberry Pi 5 (S13-05). Instalar: https://github.com/mavlink-router/mavlink-router
# /etc/mavlink-router/main.conf
[General]
TcpServerPort = 5760
ReportStats = false
Log = /var/log/dronswarm/tlog           # registro .tlog de cada vuelo (caja negra del lado de la computadora)
LogMode = while-armed

[UartEndpoint pixhawk]
Device = /dev/ttyAMA0                   # TELEM2 de la Pixhawk 6C (MAV_1_CONFIG = TELEM2, 921600, modo onboard)
Baud = 921600

[UdpEndpoint swarm_node]                # el nodo del enjambre (MAVSDK) en la misma Pi
Mode = Normal
Address = 127.0.0.1
Port = 14540

[UdpEndpoint mission_scripts]           # misiones (inspección, entrega) lanzadas desde la Pi
Mode = Normal
Address = 127.0.0.1
Port = 14541

[UdpEndpoint gcs_over_mesh]             # QGroundControl por la red del enjambre (la RFD900x es el enlace principal)
Mode = Server
Address = 0.0.0.0
Port = 14550
